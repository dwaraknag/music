<!DOCTYPE html>
<html>
<head>
  <title>Music for Your Mood</title>
<style>
body {
    background-image: url("{{ bg_image }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
}
a {
    color: #00ffff;
}
.container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
}

h1, h2, h3 {
    text-align: center;
    color: #00796b;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

textarea {
    resize: none;
    padding: 10px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    padding: 12px;
    border: none;
    background-color: #009688;
    color: white;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background-color: #00796b;
}

ul {
    list-style-type: none;
    padding-left: 0;
}

li {
    padding: 8px 0;
}

a {
    color: #00796b;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
  <h2>Mood Detected: {{ mood }}</h2>
  <h3>Recommended Songs:</h3>
  <ul>
    {% for song in songs %}
      <li><a href="{{ song.url }}" target="_blank">{{ song.title }}</a></li>
    {% endfor %}
  </ul>
  <a href="/">Go back</a>
</body>
</html>
